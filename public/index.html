<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevBlog API - Interface Web</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div>
      <h1>📝 DevBlog</h1>
      <p>Interface web pour gérer les articles du blog</p>
    </div>
    <div class="header-actions">
      <a href="/api-docs" target="_blank" class="btn btn-dark">Swagger</a>
      <a href="/api/articles" target="_blank" class="btn btn-light">API JSON</a>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="form-title">Créer un article</h2>

      <div id="message" class="message hidden"></div>

      <form id="article-form">
        <div class="grid">
          <div class="form-group">
            <label for="titre">Titre</label>
            <input type="text" id="titre" required />
          </div>

          <div class="form-group">
            <label for="auteur">Auteur</label>
            <input type="text" id="auteur" required />
          </div>

          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" />
          </div>

          <div class="form-group">
            <label for="categorie">Catégorie</label>
            <input type="text" id="categorie" required />
          </div>

          <div class="form-group full-width">
            <label for="tags">Tags (séparés par des virgules)</label>
            <input type="text" id="tags" placeholder="nodejs, express, api" />
          </div>

          <div class="form-group full-width">
            <label for="contenu">Contenu</label>
            <textarea id="contenu" rows="6" required></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">
            Ajouter l'article
          </button>
          <button type="button" class="btn btn-secondary hidden" id="cancel-edit-btn">
            Annuler la modification
          </button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Recherche et filtres</h2>

      <div class="filters">
        <input type="text" id="search-input" placeholder="Rechercher dans le titre ou le contenu..." />
        <button class="btn btn-primary" id="search-btn">Rechercher</button>
      </div>

      <div class="grid">
        <div class="form-group">
          <label for="filter-categorie">Filtrer par catégorie</label>
          <input type="text" id="filter-categorie" placeholder="Tech" />
        </div>

        <div class="form-group">
          <label for="filter-auteur">Filtrer par auteur</label>
          <input type="text" id="filter-auteur" placeholder="Ali" />
        </div>

        <div class="form-group">
          <label for="filter-date">Filtrer par date</label>
          <input type="date" id="filter-date" />
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" id="filter-btn">Appliquer les filtres</button>
        <button class="btn btn-secondary" id="reset-btn">Réinitialiser</button>
      </div>
    </section>

    <section class="card">
      <div class="articles-header">
        <h2>Liste des articles</h2>
        <button class="btn btn-light" id="refresh-btn">Actualiser</button>
      </div>
      <div id="articles-container" class="articles-container"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
